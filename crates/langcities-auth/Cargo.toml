[package]
name = "langcities-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]

sqlite = ["sea-orm/sqlx-sqlite"]
postgres = ["sea-orm/sqlx-postgres"]
mysql = ["sea-orm/sqlx-mysql"]

dev = ["sea-orm/debug-print"]

[dependencies]
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
langcities-common = { path = "../langcities-common" }
langcities-common-db = { path = "../langcities-common-db" }
langcities-config = { path = "../langcities-config" }
serde = { version = "1.0.229", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "json"] }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"

[dependencies.log]
version = "0.4.33"
features = ["std", "serde"]

[dependencies.sea-orm]
version = "^2.0.2"
default-features = false
features = ["macros", "runtime-tokio-rustls", "with-chrono"]

[dependencies.tokio]
version = "1.53.1"
features = ["full"]
