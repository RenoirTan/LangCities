[package]
name = "langcities-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]

sqlite = ["sea-orm/sqlx-sqlite", "tower-sessions-sqlx-store/sqlite"]
postgres = ["sea-orm/sqlx-postgres", "tower-sessions-sqlx-store/postgres"]
mysql = ["sea-orm/sqlx-mysql", "tower-sessions-sqlx-store/mysql"]

dev = ["sea-orm/debug-print"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
langcities-common = { path = "../langcities-common", features = ["axum"] }
langcities-common-db = { path = "../langcities-common-db" }
langcities-common-server = { path = "../langcities-common-server" }
langcities-config = { path = "../langcities-config" }
langcities-jwt = { path = "../langcities-jwt" }
serde = { version = "1.0.229", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "json"] }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
argon2 = "0.5.3" # Update to 0.6 to fix dependency errors when it releases
password-hash = { version = "0.6.1", features = ["getrandom"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
tower-sessions = { version = "0.15.0", features = ["signed", "private"] }
# Replace git commit with actual semver when they release the fixed Cargo.toml with updated deps >:(
tower-sessions-sqlx-store = {
    git = "https://github.com/maxcountryman/tower-sessions-stores.git",
    rev = "75cb757",
    package = "tower-sessions-sqlx-store",
    features = ["postgres"],
}
async-trait = "0.1.92"
time = "0.3.55"

[dependencies.log]
version = "0.4.33"
features = ["std", "serde"]

[dependencies.sea-orm]
version = "^2.0.2"
default-features = false
features = ["macros", "runtime-tokio-rustls", "with-chrono"]

[dependencies.tokio]
version = "1.53.1"
features = ["full"]
