[package]
name = "langcities-common-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
default = []
dto = ["dep:utoipa", "dep:chrono", "dep:langcities-lcdcdsl"]
auth-client = ["dto", "dep:reqwest"]

[dependencies]
langcities-common = { path = "../langcities-common" }
langcities-config = { path = "../langcities-config" }
clap = { version = "4.6.6", features = ["string"] }
figment = { version = "0.10.19", features = ["env"] }
serde = { version = "1.0.229", features = ["derive"] }
utoipa = { version = "5.5.0", features = ["chrono"], optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
langcities-lcdcdsl = { path = "../langcities-lcdcdsl", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
